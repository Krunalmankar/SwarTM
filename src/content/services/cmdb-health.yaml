problem:
  heading: If people don’t trust the CMDB, AI can’t either.
  items:
    - icon: listSearch
      title: Missing critical attributes
      text: CIs without owners, support groups or environments break routing, impact analysis and reporting.
    - icon: copy
      title: Duplicates and messy names
      text: Unnormalized company and vendor names fragment CMDB, ITAM and SAM data.
    - icon: searchAlert
      title: Silent drift
      text: Discovery failures and stale CIs go unnoticed until an outage or audit finds them.

approach:
  heading: Measure the gaps, fix them at the source and automate the controls.
  steps:
    - title: Baseline
      text: CMDB Health scores for completeness, correctness and compliance.
    - title: Fix the sources
      text: Discovery, Service Mapping, IRE rules and NDS normalization.
    - title: Automate
      text: Agentic workflows raise certification tasks and report Discovery health daily.
    - title: Govern
      text: Clear ownership, policies and a monthly health review.

deliverables:
  - CMDB health baseline report
  - CSDM-aligned class and relationship model
  - Discovery and Service Mapping configuration
  - Company normalization with NDS
  - Automated attribute validation and certification
  - CMDB governance playbook

