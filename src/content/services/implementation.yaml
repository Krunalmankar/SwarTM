problem:
  heading: Modules are live, but they do not work as one platform.
  items:
    - icon: wrench
      title: Heavy customisation
      text: Custom code where out-of-the-box would do makes every upgrade slow and risky.
    - icon: unlink
      title: Disconnected data
      text: Without CSDM, incidents, changes and services don’t link to the CIs and offerings they affect.
    - icon: info
      title: Value stuck after go-live
      text: Teams use a fraction of what they licensed, and AI features have nothing solid to build on.

approach:
  heading: Out-of-the-box first, CSDM throughout.
  steps:
    - title: Assess & design
      text: Current-state review and a CSDM-aligned solution design.
    - title: Configure
      text: Build with platform capabilities first; customise only with a reason.
    - title: Test & deploy
      text: Structured migration from development to test to production, with UAT support.
    - title: Hand over
      text: Training, documentation and hypercare for your team.

deliverables:
  - Solution design document
  - CSDM-aligned service and data model
  - 'Configured modules: ITSM, ITOM, IRM and more'
  - Enterprise integrations
  - Test scripts and UAT support
  - Technical documentation, runbooks and training

