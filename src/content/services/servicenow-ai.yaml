problem:
  heading: AI is enabled, but the value has not yet followed.
  items:
    - icon: info
      title: Licences without use cases
      text: Now Assist is enabled, but no one owns which skills and agents should deliver value first.
    - icon: databaseSimple
      title: Agents can’t act on bad data
      text: Incomplete CMDB and weak knowledge make AI answers unreliable and actions risky.
    - icon: shieldAlert
      title: No governance model
      text: Unclear who approves agents, what they can touch, and how their results are measured.

approach:
  heading: Prove one use case, then scale.
  steps:
    - title: Discover
      text: Rank AI use cases by value and data readiness.
    - title: Prepare
      text: Fix the data, set up service accounts, ACLs and AI Control Tower governance.
    - title: Prove
      text: Build one agentic workflow end to end and measure it.
    - title: Scale
      text: Roll out to production, drive adoption, add the next use case.

deliverables:
  - Prioritised AI use-case roadmap
  - Data-readiness assessment (CMDB, knowledge, catalog)
  - Configured Now Assist skills
  - AI Agents and agentic workflows in production
  - Governance set-up in AI Control Tower
  - Technical design document and runbooks

