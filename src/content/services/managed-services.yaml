  heading: Go-live is the start, not the finish.
  items:
    - icon: userAlert
      title: Stretched internal teams
      text: A small platform team juggles tickets, requests and roadmap work at once.
    - icon: refresh
      title: Upgrades keep slipping
      text: Falling behind releases means missing the newest AI capabilities.
    - icon: trend
      title: Quality decays quietly
      text: Data and agent performance slide without someone watching them.

